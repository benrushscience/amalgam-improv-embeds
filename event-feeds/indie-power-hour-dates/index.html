<!-- Squarespace embed: Indie Power Hour events (Event Name contains "Indie Power Hour"). -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indie Power Hour Events</title>
  <style>
    /* ---------- Feed structure ---------- */
    body {
      background-color: #f4f4f4;
      color: #333;
      font-family: Arial, sans-serif;
    }

    .feed-container {
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgb(0 0 0 / 0.1);
      margin: 0 auto;
      max-width: 1600px;
      padding: 20px;
    }

    /* Low-opacity Echo Rings add motion while keeping event details readable. */
    .rss-echo-rings {
      animation: rss-echo-color-drift 16s ease-in-out infinite;
      background: linear-gradient(135deg, #fffdf9, #f9e7ef, #fff8d1);
      background-size: 180% 180%;
      isolation: isolate;
      overflow: hidden;
      position: relative;
    }

    .rss-echo-rings::after {
      animation: rss-echo-expand 11s ease-in-out infinite;
      background: repeating-radial-gradient(
        circle,
        transparent 0 10px,
        rgb(189 0 91 / 0.16) 11px 14px,
        transparent 15px 23px
      );
      border-radius: 50%;
      content: '';
      height: 240px;
      pointer-events: none;
      position: absolute;
      right: -110px;
      top: -105px;
      width: 240px;
      z-index: 0;
    }

    .rss-echo-rings > * {
      position: relative;
      z-index: 1;
    }

    @keyframes rss-echo-color-drift {
      50% { background-position: 100% 100%; }
    }

    @keyframes rss-echo-expand {
      50% { opacity: 0.35; transform: scale(1.17); }
    }

    /* ---------- Loading state ---------- */
    .loading-state {
      align-items: center;
      color: #666;
      display: flex;
      font-size: 0.95rem;
      gap: 10px;
      padding: 12px 0;
    }

    .loading-state.hidden { display: none; }

    /* Echo Rings spinner inspired by Amalgam's psychedelic circle mark. */
    .loading-spinner {
      animation: echo-ring 1.5s ease-in-out infinite;
      border: 3px solid #bd005b;
      border-radius: 50%;
      color: #bd005b;
      flex-shrink: 0;
      height: 32px;
      position: relative;
      width: 32px;
    }

    .loading-spinner::before,
    .loading-spinner::after {
      border: 3px solid currentColor;
      border-radius: 50%;
      content: '';
      left: 50%;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .loading-spinner::before {
      animation: echo-ring-inner 1.5s ease-in-out 0.18s infinite reverse;
      height: 60%;
      width: 60%;
    }

    .loading-spinner::after {
      animation: echo-ring-inner 1.5s ease-in-out 0.36s infinite;
      height: 25%;
      width: 25%;
    }

    @keyframes echo-ring {
      50% { opacity: 0.18; transform: scale(0.42); }
    }

    @keyframes echo-ring-inner {
      50% { opacity: 0.18; transform: translate(-50%, -50%) scale(0.42); }
    }

    /* ---------- Event cards and actions ---------- */
    .event { border-bottom: 1px solid #ddd; padding: 20px 0; }
    .event:last-child { border-bottom: none; }
    .event h3 { font-size: 1.5em; margin: 0 0 10px; }
    .event p { margin: 8px 0; }
    .event a { color: #007bff; text-decoration: none; }
    .event a:hover { text-decoration: underline; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      border: 1px solid #007bff;
      border-radius: 6px;
      display: inline-block;
      padding: 8px 12px;
    }

    .empty-state {
      color: #666;
      padding: 24px 0;
      text-align: center;
    }

    .load-more-wrap {
      margin-top: 16px;
      text-align: center;
    }

    .load-more-btn {
      background: #fff;
      border: 1px solid #007bff;
      border-radius: 6px;
      color: #007bff;
      cursor: pointer;
      font: inherit;
      padding: 10px 16px;
    }

    .load-more-btn:hover { background: #eef6ff; }

    /* Preserve a calm, recognizable loading state when motion is reduced. */
    @media (prefers-reduced-motion: reduce) {
      .rss-echo-rings,
      .rss-echo-rings::after,
      .loading-spinner,
      .loading-spinner::before,
      .loading-spinner::after { animation: none; }
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Oswald:wght@200..700&display=swap" />
  <style>
    h1, h2, h3 { font-family: "Oswald", Impact, sans-serif; }
    p { font-family: "Arimo", Arial, sans-serif; }
  </style>
</head>
<body>
  <div class="feed-container rss-echo-rings">
    <div id="loading-state" class="loading-state" aria-live="polite">
      <div class="loading-spinner" aria-hidden="true"></div>
      <span>Loading events</span>
    </div>
    <div id="rss-feed" aria-busy="true"></div>
  </div>

  <script>
    // ---------- Feed configuration ----------
    const rssUrl =
      'https://script.google.com/macros/s/AKfycbyKAy9w0-nFU9FLYFxLAonIssaUnAgImseLr7NICtXvCe1wnd-yiI3h29fDN7ipH0_mSg/exec';
    const maxEventsToShow = 200;
    const eventsPerLoad = 5;
    const defaultEventDurationMinutes = 120;
    const requiredTitleSubstring = 'indie power hour'; // Case-insensitive title filter.

    // ---------- DOM references ----------
    const feedEl = document.getElementById('rss-feed');
    const loadingEl = document.getElementById('loading-state');

    function hideLoadingState() {
      loadingEl.classList.add('hidden');
      feedEl.setAttribute('aria-busy', 'false');
    }

    // ---------- RSS parsing helpers ----------
    function getText(node, selector) {
      const element = node.querySelector(selector);
      return element ? (element.textContent || '').trim() : '';
    }

    function parseDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function stripScripts(html) {
      return (html || '').replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
    }

    function removeTypeAndWebsiteLines(html) {
      return (html || '')
        .replace(/<strong>\s*Type:\s*<\/strong>.*?(<br\/>|<\/p>)/gi, '')
        .replace(/<strong>\s*Website RSS Display:\s*<\/strong>.*?(<br\/>|<\/p>)/gi, '')
        .replace(/Type:\s*[^\n<]+/gi, '')
        .replace(/Website RSS Display:\s*[^\n<]+/gi, '')
        .replace(/<p>\s*<a\b[^>]*>\s*Event link\s*<\/a>\s*<\/p>/gi, '')
        .replace(/<a\b[^>]*>\s*Event link\s*<\/a>/gi, '')
        .replace(/(<br\/>\s*){2,}/g, '<br/>')
        .replace(/<p>\s*<\/p>/gi, '')
        .trim();
    }

    function plainText(html) {
      return (html || '')
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/?[^>]+>/g, '')
        .trim();
    }

    function extractLocation(html) {
      const match = plainText(html).match(/Location:\s*(.+)/i);
      return match ? match[1].split('\n')[0].trim() : '';
    }

    function pad(value) { return String(value).padStart(2, '0'); }

    function toUtc(date) {
      return date.getUTCFullYear() + pad(date.getUTCMonth() + 1) + pad(date.getUTCDate()) +
        'T' + pad(date.getUTCHours()) + pad(date.getUTCMinutes()) + pad(date.getUTCSeconds()) + 'Z';
    }

    // ---------- Calendar-link helpers ----------
    function googleCalUrl({ title, description, start, end, location }) {
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: title,
        details: description,
        dates: `${toUtc(start)}/${toUtc(end)}`,
        location: location || ''
      });
      return `https://www.google.com/calendar/render?${params.toString()}`;
    }

    function icsEscape(text) {
      return (text || '')
        .replace(/\\/g, '\\\\')
        .replace(/\n/g, '\\n')
        .replace(/,/g, '\\,')
        .replace(/;/g, '\\;');
    }

    function createIcsUrl({ title, description, start, end, link, location }) {
      const uid = `${Date.now()}-${Math.random().toString(36).slice(2)}@amalgamimprov`;
      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Amalgam Improv//Events//EN',
        'BEGIN:VEVENT',
        `UID:${uid}`,
        `DTSTAMP:${toUtc(new Date())}`,
        `DTSTART:${toUtc(start)}`,
        `DTEND:${toUtc(end)}`,
        `SUMMARY:${icsEscape(title)}`,
        `DESCRIPTION:${icsEscape(description)}`,
        location ? `LOCATION:${icsEscape(location)}` : '',
        link ? `URL:${icsEscape(link)}` : '',
        'END:VEVENT',
        'END:VCALENDAR'
      ].filter(Boolean).join('\r\n');

      return URL.createObjectURL(new Blob([lines], { type: 'text/calendar;charset=utf-8' }));
    }

    // ---------- Fetch, filter, and render the RSS feed ----------
    fetch(rssUrl)
      .then(response => response.text())
      .then(xml => new DOMParser().parseFromString(xml, 'text/xml'))
      .then(document => {
        const now = new Date();
        const visibleItems = Array.from(document.querySelectorAll('item'))
          .map(node => {
            const title = getText(node, 'title');
            const link = getText(node, 'link');
            const start = parseDate(getText(node, 'pubDate'));

            if (!title.toLowerCase().includes(requiredTitleSubstring) || !start || start < now) {
              return null;
            }

            const cleanDescription = removeTypeAndWebsiteLines(stripScripts(getText(node, 'description')));
            return {
              title,
              link,
              start,
              end: new Date(start.getTime() + defaultEventDurationMinutes * 60000),
              cleanDescription,
              plainDescription: plainText(cleanDescription),
              location: extractLocation(cleanDescription)
            };
          })
          .filter(Boolean)
          .sort((first, second) => first.start - second.start)
          .slice(0, maxEventsToShow);

        let visibleEventCount = 0;

        function renderEvent(event, index) {
          return `
            <div class="event">
              <h3>${event.title}</h3>
              ${event.cleanDescription ? `<div class="event-desc">${event.cleanDescription}</div>` : ''}
              ${event.link ? `<p><a href="${event.link}" target="_blank" rel="noopener noreferrer">Link</a></p>` : ''}
              <div class="actions">
                <a class="btn" href="${googleCalUrl({ title: event.title, description: event.plainDescription, start: event.start, end: event.end, location: event.location })}" target="_blank" rel="noopener noreferrer">Add to Google Calendar</a>
                <a class="btn ics-download" href="#" data-event-index="${index}" download="${encodeURIComponent(event.title)}.ics">Download .ics</a>
              </div>
            </div>`;
        }

        function updateLoadMoreButton() {
          let button = document.getElementById('load-more-events');
          if (visibleEventCount >= visibleItems.length) {
            if (button) button.parentElement.remove();
            return;
          }

          if (!button) {
            const wrap = document.createElement('div');
            wrap.className = 'load-more-wrap';
            button = document.createElement('button');
            button.id = 'load-more-events';
            button.className = 'load-more-btn';
            button.type = 'button';
            button.addEventListener('click', renderNextEvents);
            wrap.appendChild(button);
            feedEl.insertAdjacentElement('afterend', wrap);
          }

          const remaining = visibleItems.length - visibleEventCount;
          button.textContent = remaining === 1 ? 'Load final event' : `Load next event (${remaining} remaining)`;
        }

        function renderNextEvents() {
          if (!visibleItems.length) {
            feedEl.innerHTML = '<div class="empty-state">No upcoming Indie Power Hour events.</div>';
            return;
          }

          const nextItems = visibleItems.slice(visibleEventCount, visibleEventCount + eventsPerLoad);
          feedEl.insertAdjacentHTML('beforeend', nextItems.map((event, offset) => renderEvent(event, visibleEventCount + offset)).join(''));
          visibleEventCount += nextItems.length;
          updateLoadMoreButton();
        }

        feedEl.addEventListener('click', clickEvent => {
          const downloadLink = clickEvent.target.closest('.ics-download');
          if (!downloadLink) return;

          clickEvent.preventDefault();
          const event = visibleItems[Number(downloadLink.dataset.eventIndex)];
          if (!event) return;

          const url = createIcsUrl({
            title: event.title,
            description: event.plainDescription,
            start: event.start,
            end: event.end,
            link: event.link,
            location: event.location
          });
          const temporaryLink = document.createElement('a');
          temporaryLink.href = url;
          temporaryLink.download = `${encodeURIComponent(event.title)}.ics`;
          document.body.appendChild(temporaryLink);
          temporaryLink.click();
          temporaryLink.remove();
          setTimeout(() => URL.revokeObjectURL(url), 30000);
        });

        renderNextEvents();
      })
      .catch(error => {
        console.error('Unable to load Indie Power Hour events.', error);
        feedEl.innerHTML = '<div class="empty-state">Error loading events.</div>';
      })
      .finally(hideLoadingState);
  </script>
</body>
</html>
